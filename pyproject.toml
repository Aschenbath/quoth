[project]
name = "quoth"
version = "0.1.0"
description = "Which texts can an open-weight language model recite verbatim?"
requires-python = ">=3.11"
dependencies = ["torch", "transformers>=5"]
license = "MIT"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quoth"]
